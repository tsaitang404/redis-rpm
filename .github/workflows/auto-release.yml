name: Auto Build and Release on Upstream Tag

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Redis version tag to build (e.g. 8.10.1). Leave empty to auto-detect latest.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            LATEST=$(git ls-remote --tags https://github.com/redis/redis.git \
              | grep -oP 'refs/tags/\K[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
            echo "Latest upstream tag: $LATEST"
            if gh release view "$LATEST" --repo ${{ github.repository }} &>/dev/null; then
              echo "Release $LATEST already exists, skipping."
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "tag=$LATEST" >> $GITHUB_OUTPUT
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Sync fork with upstream
        if: steps.detect.outputs.should_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/redis/redis-rpm.git 2>/dev/null || true
          git fetch upstream
          git merge upstream/unstable --no-edit || true
          git push origin unstable || true

  build-rpm:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu24-arm64-2-8' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux
            version: 8
            platform: amd64
          - distro: rockylinux
            version: 9
            platform: amd64
          - distro: rockylinux
            version: 10
            platform: amd64
          - distro: rockylinux
            version: 8
            platform: arm64
          - distro: rockylinux
            version: 9
            platform: arm64
          - distro: rockylinux
            version: 10
            platform: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.platform != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Build RPM in builder container
        env:
          REDIS_VERSION: ${{ needs.check-upstream.outputs.tag }}
        run: |
          set -ex
          DISTRO="${{ matrix.distro }}${{ matrix.version }}"
          DOCKERFILE="dockerfiles/Dockerfile.${DISTRO}"
          
          # Build the builder image
          docker build \
            --platform linux/${{ matrix.platform }} \
            -t "redis-builder:${DISTRO}" \
            -f "$DOCKERFILE" \
            .
          
          # Run the build inside the builder
          docker run --rm \
            --platform linux/${{ matrix.platform }} \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e REDIS_VERSION="$REDIS_VERSION" \
            "redis-builder:${DISTRO}" \
            bash /workspace/build-one.sh
          
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.distro }}${{ matrix.version }}-${{ matrix.platform }}
          path: dist/*.rpm
          retention-days: 1

  publish:
    needs: [check-upstream, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-rpms
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Redis $TAG RPM" \
            --generate-notes \
            all-rpms/*.rpm
