name: Auto Build and Release on Upstream Tag
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Redis version tag (e.g. 8.10.1) or 'unstable'"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/builder

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building Redis $TAG"

  build-rpm:
    needs: check-upstream
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux
            version: 8
          - distro: rockylinux
            version: 9
          - distro: rockylinux
            version: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build RPM
        env:
          REDIS_VERSION: ${{ needs.check-upstream.outputs.tag }}
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e REDIS_VERSION="$REDIS_VERSION" \
            ${{ matrix.distro }}:${{ matrix.version }} \
            bash /workspace/build-one.sh
          cp /tmp/*.rpm dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redis-rpm-${{ matrix.distro }}${{ matrix.version }}
          path: dist/*.rpm

  publish:
    needs: [check-upstream, build-rpm]
    runs-on: ubuntu-latest
    if: needs.check-upstream.outputs.tag != ''
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          mkdir -p release
          find artifacts/ -name "*.rpm" -exec cp {} release/ \;
          ls -lh release/
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            gh release upload "$TAG" release/*.rpm --repo ${{ github.repository }} --clobber
          else
            gh release create "$TAG" release/*.rpm \
              --repo ${{ github.repository }} \
              --title "Redis $TAG RPM" \
              --generate-notes
          fi
