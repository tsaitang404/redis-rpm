name: Auto Build and Release on Upstream Tag

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Redis version tag to build (e.g. 8.10.1). Leave empty to auto-detect latest.'
        required: false
        type: string

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/builder

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            LATEST=$(git ls-remote --tags https://github.com/redis/redis.git \
              | grep -oP 'refs/tags/\K[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
            echo "Latest upstream tag: $LATEST"
            if gh release view "$LATEST" --repo ${{ github.repository }} &>/dev/null; then
              echo "Release $LATEST already exists, skipping."
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "tag=$LATEST" >> $GITHUB_OUTPUT
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Sync fork with upstream
        if: steps.detect.outputs.should_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/redis/redis-rpm.git 2>/dev/null || true
          git fetch upstream
          git merge upstream/unstable --no-edit || true
          git push origin unstable || true

  build-rpm:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu24-arm64-2-8' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux8
            platform: amd64
          - distro: rockylinux9
            platform: amd64
          - distro: rockylinux10
            platform: amd64
          - distro: rockylinux8
            platform: arm64
          - distro: rockylinux9
            platform: arm64
          - distro: rockylinux10
            platform: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        name: Download build script

      - name: Build RPM in container
        env:
          REDIS_VERSION: ${{ needs.check-upstream.outputs.tag }}
        run: |
          set -ex
          # Use our own builder image (built by build_workflow_containers.yaml)
          TAG="${{ matrix.distro }}-${{ github.sha }}"
          # Try with SHA first, fall back to unstable branch ref
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          if ! docker pull "$IMAGE" 2>/dev/null; then
            IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ matrix.distro }}-unstable"
          fi
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e REDIS_VERSION="$REDIS_VERSION" \
            "$IMAGE" \
            bash /workspace/build-one.sh
          mkdir -p dist
          cp workspace/dist/*.rpm dist/ 2>/dev/null || cp dist/*.rpm dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.distro }}-${{ matrix.platform }}
          path: dist/*.rpm
          retention-days: 1

  publish:
    needs: [check-upstream, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-rpms
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Redis $TAG RPM" \
            --generate-notes \
            all-rpms/*.rpm
