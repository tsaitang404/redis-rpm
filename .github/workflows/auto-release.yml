name: Auto Build and Release on Upstream Tag
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Redis version tag (e.g. 8.10.1, 7.4.11, 6.2.24)"
        required: true
jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
  build-rpm:
    needs: check-upstream
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux
            version: 8
            disttag: el8
            arch: amd64
          - distro: rockylinux
            version: 9
            disttag: el9
            arch: amd64
          - distro: rockylinux
            version: 10
            disttag: el10
            arch: amd64
          - distro: rockylinux
            version: 8
            disttag: el8
            arch: aarch64
          - distro: rockylinux
            version: 9
            disttag: el9
            arch: aarch64
          - distro: rockylinux
            version: 10
            disttag: el10
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and package
        env:
          REDIS_VERSION: ${{ needs.check-upstream.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          DISTTAG: ${{ matrix.disttag }}
        run: |
          BUILDER_IMAGE="ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-amd64"
          # aarch64: cross-compile on amd64 image, skip modules
          # amd64: native build with modules
          docker pull "$BUILDER_IMAGE" 2>/dev/null || \
          docker build -t "$BUILDER_IMAGE" -f dockerfiles/Dockerfile.${{ matrix.distro }}${{ matrix.version }} .
          docker push "$BUILDER_IMAGE" 2>/dev/null || true
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e REDIS_VERSION="$REDIS_VERSION" \
            -e DISTTAG="$DISTTAG" \
            -e ARCH="$ARCH" \
            "$BUILDER_IMAGE" bash -c 'bash /workspace/build-one.sh && bash /workspace/rpm-build.sh'
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: redis-rpm-${{ matrix.distro }}${{ matrix.version }}-${{ matrix.arch }}
          path: dist/*.rpm
  publish:
    needs: [check-upstream, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          mkdir -p release
          find artifacts/ -name "*.rpm" -exec cp {} release/ \;
          ls -lh release/
          if [ -z "$(ls release/*.rpm 2>/dev/null)" ]; then echo "No RPMs!"; exit 1; fi
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            gh release upload "$TAG" release/*.rpm --repo ${{ github.repository }} --clobber
          else
            gh release create "$TAG" release/*.rpm --repo ${{ github.repository}} --title "Redis $TAG RPM" --generate-notes
          fi
