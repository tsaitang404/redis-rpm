name: Auto Build and Release on Upstream Tag
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Redis version tag (e.g. 8.10.1, 7.4.11, 6.2.24)"
        required: true
jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      major: ${{ steps.check.outputs.major }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
  build-rpm:
    needs: check-upstream
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux
            version: 8
            disttag: el8
          - distro: rockylinux
            version: 9
            disttag: el9
          - distro: rockylinux
            version: 10
            disttag: el10
    steps:
      - uses: actions/checkout@v4
      - name: Pull builder image
        run: |
          docker pull ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-${{ github.sha }}-amd64 2>/dev/null || \
          docker pull ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-unstable 2>/dev/null || \
          echo "NEED_BUILD=true" >> $GITHUB_ENV
      - name: Build builder image
        if: env.NEED_BUILD == 'true'
        run: |
          docker build -t ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-unstable -f dockerfiles/Dockerfile.${{ matrix.distro }}${{ matrix.version }} .
          docker push ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-unstable || true
      - name: Build and package
        env:
          REDIS_VERSION: ${{ needs.check-upstream.outputs.tag }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-${{ github.sha }}-amd64"
          docker image inspect "$IMAGE" &>/dev/null || IMAGE="ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-unstable"
          mkdir -p dist
          docker run --rm -v "$PWD:/workspace" -w /workspace -e REDIS_VERSION="$REDIS_VERSION" -e DISTTAG="${{ matrix.disttag }}" "$IMAGE" bash -c 'bash /workspace/build-one.sh && bash /workspace/rpm-build.sh'
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: redis-rpm-${{ matrix.distro }}${{ matrix.version }}
          path: dist/*.rpm
  publish:
    needs: [check-upstream, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          mkdir -p release
          find artifacts/ -name "*.rpm" -exec cp {} release/ \;
          ls -lh release/
          if [ -z "$(ls release/*.rpm 2>/dev/null)" ]; then echo "No RPMs!"; exit 1; fi
          if gh release view "$TAG" --repo ${{ github.repository }} &>/dev/null; then
            gh release upload "$TAG" release/*.rpm --repo ${{ github.repository }} --clobber
          else
            gh release create "$TAG" release/*.rpm --repo ${{ github.repository }} --title "Redis $TAG RPM" --generate-notes
          fi
