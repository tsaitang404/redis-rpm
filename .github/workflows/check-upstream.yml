name: Check Upstream and Build

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream tags
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get latest stable upstream tag (redis/redis) - filter for Redis version tags only (v6.x.x, v7.x.x or v8.x.x)
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/redis/redis/tags | jq -r '.[].name' | grep -E '^v[678]\.[0-9]+\.[0-9]+$' | head -1)
          echo "upstream: $UPSTREAM_TAG"
          
          # If no version tag found, try releases API
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            UPSTREAM_TAG=$(curl -s https://api.github.com/repos/redis/redis/releases/latest | jq -r '.tag_name')
            echo "upstream (from releases): $UPSTREAM_TAG"
          fi

          # Get our latest release (excluding -core releases)
          OUR_TAG=$(gh release list --repo ${{ github.repository }} --limit 10 --json tagName --jq '.[].tagName' | grep -v '\-core$' | head -1)
          echo "ours: $OUR_TAG"

          if [ "$UPSTREAM_TAG" != "$OUR_TAG" ] && [ "$UPSTREAM_TAG" != "null" ] && [ "$UPSTREAM_TAG" != "" ]; then
            echo "new=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
            echo "New upstream version found: $UPSTREAM_TAG (ours: $OUR_TAG)"
          else
            echo "new=false" >> $GITHUB_OUTPUT
            echo "Already up to date: $UPSTREAM_TAG"
          fi

      - name: Trigger build
        if: steps.check.outputs.new == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-release.yml',
              ref: 'unstable',
              inputs: {
                release_tag: '${{ steps.check.outputs.tag }}'
              }
            });
            console.log('Triggered build for ${{ steps.check.outputs.tag }}');
