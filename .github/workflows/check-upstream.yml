name: Check Upstream and Build

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream tags
        id: check
        run: |
          # Get latest upstream tag (redis/redis)
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/redis/redis/tags | jq -r '.[0].name')
          echo "upstream: $UPSTREAM_TAG"

          # Get our latest release
          OUR_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "none")
          echo "ours: $OUR_TAG"

          if [ "$UPSTREAM_TAG" != "$OUR_TAG" ] && [ "$UPSTREAM_TAG" != "null" ] && [ "$UPSTREAM_TAG" != "" ]; then
            echo "new=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
            echo "New upstream version found: $UPSTREAM_TAG (ours: $OUR_TAG)"
          else
            echo "new=false" >> $GITHUB_OUTPUT
            echo "Already up to date: $UPSTREAM_TAG"
          fi

      - name: Trigger build
        if: steps.check.outputs.new == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-release.yml',
              ref: 'unstable',
              inputs: {
                release_tag: '${{ steps.check.outputs.tag }}'
              }
            });
            console.log('Triggered build for ${{ steps.check.outputs.tag }}');
