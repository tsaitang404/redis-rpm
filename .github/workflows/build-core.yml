name: Build Core Only (No Modules)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Redis version tag (e.g. 8.10.1, 7.4.11, 6.2.24)"
        required: true
jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT

  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux
            version: 8
            arch: amd64
          - distro: rockylinux
            version: 9
            arch: amd64
          - distro: rockylinux
            version: 10
            arch: amd64
          - distro: rockylinux
            version: 8
            arch: aarch64
          - distro: rockylinux
            version: 9
            arch: aarch64
          - distro: rockylinux
            version: 10
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push builder image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-${{ matrix.arch }}
        run: |
          PLATFORM_FLAG=""
          if [ "${{ matrix.arch }}" = "aarch64" ]; then PLATFORM_FLAG="--platform linux/arm64"; fi
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "Image already cached: $IMAGE"
          else
            echo "Building image: $IMAGE"
            docker build $PLATFORM_FLAG -t "$IMAGE" -f dockerfiles/Dockerfile.${{ matrix.distro }}${{ matrix.version }} .
            docker push "$IMAGE"
          fi

  build-rpm:
    needs: [check-upstream, build-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux
            version: 8
            disttag: el8
            arch: amd64
          - distro: rockylinux
            version: 9
            disttag: el9
            arch: amd64
          - distro: rockylinux
            version: 10
            disttag: el10
            arch: amd64
          - distro: rockylinux
            version: 8
            disttag: el8
            arch: aarch64
          - distro: rockylinux
            version: 9
            disttag: el9
            arch: aarch64
          - distro: rockylinux
            version: 10
            disttag: el10
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and package
        env:
          REDIS_VERSION: ${{ needs.check-upstream.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          DISTTAG: ${{ matrix.disttag }}
          BUILD_MODULES: "false"
        run: |
          BUILDER_IMAGE="ghcr.io/${{ github.repository }}/builder:${{ matrix.distro }}${{ matrix.version }}-${{ matrix.arch }}"
          PLATFORM_FLAG=""
          if [ "$ARCH" = "aarch64" ]; then PLATFORM_FLAG="--platform linux/arm64"; fi
          docker pull "$BUILDER_IMAGE"
          mkdir -p dist
          docker run --rm $PLATFORM_FLAG \
            -v "$PWD:/workspace" -w /workspace \
            -e REDIS_VERSION="$REDIS_VERSION" \
            -e DISTTAG="$DISTTAG" \
            -e ARCH="$ARCH" \
            -e BUILD_MODULES="$BUILD_MODULES" \
            "$BUILDER_IMAGE" bash -c 'bash /workspace/build-one.sh && bash /workspace/rpm-build.sh'
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: redis-core-${{ matrix.distro }}${{ matrix.version }}-${{ matrix.arch }}
          path: dist/*.rpm

  publish:
    needs: [check-upstream, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          mkdir -p release
          find artifacts/ -name "*.rpm" -exec cp {} release/ \;
          ls -lh release/
          if [ -z "$(ls release/*.rpm 2>/dev/null)" ]; then echo "No RPMs!"; exit 1; fi
          CORE_TAG="${TAG}-core"
          if gh release view "$CORE_TAG" --repo ${{ github.repository }} &>/dev/null; then
            gh release upload "$CORE_TAG" release/*.rpm --repo ${{ github.repository }} --clobber
          else
            gh release create "$CORE_TAG" release/*.rpm --repo ${{ github.repository }} --title "Redis $TAG Core (No Modules)" --generate-notes
          fi
